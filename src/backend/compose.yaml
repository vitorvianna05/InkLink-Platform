name: inklink-platform
services:
  identity-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      IDENTITY_OWNER_PASSWORD: ${IDENTITY_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./scripts/db/init-identity.sh:/docker-entrypoint-initdb.d/10-identity.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_identity"]
      interval: 2s
      timeout: 3s
      retries: 30
  catalog-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      CATALOG_OWNER_PASSWORD: ${CATALOG_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      CATALOG_APP_PASSWORD: ${CATALOG_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54331:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./scripts/db/init-catalog.sh:/docker-entrypoint-initdb.d/10-catalog.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_catalog"]
      interval: 2s
      timeout: 3s
      retries: 30
  engagements-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${ENGAGEMENTS_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      ENGAGEMENTS_OWNER_PASSWORD: ${ENGAGEMENTS_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      ENGAGEMENTS_APP_PASSWORD: ${ENGAGEMENTS_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54332:5432"
    volumes:
      - engagements-data:/var/lib/postgresql/data
      - ./scripts/db/init-engagements.sh:/docker-entrypoint-initdb.d/10-engagements.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_engagements"]
      interval: 2s
      timeout: 3s
      retries: 30
  messaging-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${MESSAGING_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      MESSAGING_OWNER_PASSWORD: ${MESSAGING_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      MESSAGING_APP_PASSWORD: ${MESSAGING_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54333:5432"
    volumes:
      - messaging-data:/var/lib/postgresql/data
      - ./scripts/db/init-messaging.sh:/docker-entrypoint-initdb.d/10-messaging.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_messaging"]
      interval: 2s
      timeout: 3s
      retries: 30
  scheduling-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${SCHEDULING_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      SCHEDULING_OWNER_PASSWORD: ${SCHEDULING_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      SCHEDULING_APP_PASSWORD: ${SCHEDULING_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54334:5432"
    volumes:
      - scheduling-data:/var/lib/postgresql/data
      - ./scripts/db/init-scheduling.sh:/docker-entrypoint-initdb.d/10-scheduling.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_scheduling"]
      interval: 2s
      timeout: 3s
      retries: 30
  finance-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${FINANCE_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      FINANCE_OWNER_PASSWORD: ${FINANCE_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      FINANCE_APP_PASSWORD: ${FINANCE_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54335:5432"
    volumes:
      - finance-data:/var/lib/postgresql/data
      - ./scripts/db/init-finance.sh:/docker-entrypoint-initdb.d/10-finance.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_finance"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    hostname: inklink-broker
    image: rabbitmq:3.13.7-alpine
    environment:
      RABBITMQ_DEFAULT_USER: inklink
      RABBITMQ_DEFAULT_PASS: ${INKLINK_BROKER_PASSWORD:?Run Initialize-Local.ps1}
      RABBITMQ_PUBLISHER_PASS: ${INKLINK_BROKER_PUBLISHER_PASSWORD:?Run Initialize-Local.ps1}
      RABBITMQ_SCHEDULING_PUBLISHER_PASS: ${INKLINK_SCHEDULING_PUBLISHER_PASSWORD:?Run Initialize-Local.ps1}
      RABBITMQ_RESERVATION_CONSUMER_PASS: ${INKLINK_RESERVATION_CONSUMER_PASSWORD:?Run Initialize-Local.ps1}
      RABBITMQ_CONSUMER_PASS: ${INKLINK_BROKER_CONSUMER_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:5673:5672"
    volumes:
      - broker-data:/var/lib/rabbitmq
      - ./scripts/configure-broker.sh:/opt/inklink/configure-broker.sh:ro
      - ./scripts/broker-definitions.json:/opt/inklink/broker-definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
  bff-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${BFF_POSTGRES_PASSWORD:?Run Initialize-Local.ps1}
      BFF_OWNER_PASSWORD: ${BFF_OWNER_PASSWORD:?Run Initialize-Local.ps1}
      BFF_APP_PASSWORD: ${BFF_APP_PASSWORD:?Run Initialize-Local.ps1}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - bff-data:/var/lib/postgresql/data
      - ./scripts/db/init-bff.sh:/docker-entrypoint-initdb.d/10-bff.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inklink_bff"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-Local.ps1}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-Local.ps1}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run Initialize-Local.ps1}
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/localhost.key
    ports:
      - "127.0.0.1:5189:8443"
    volumes:
      - ../../artifacts/local/inklink-realm.json:/opt/keycloak/data/import/inklink-realm.json:ro
      - ../../artifacts/local/localhost.pem:/opt/keycloak/conf/localhost.pem:ro
      - ../../artifacts/local/localhost.key:/opt/keycloak/conf/localhost.key:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
  object-storage:
    # Armazenamento de objetos S3 local (decisão 0018); produção usa Cloudflare R2 pelo mesmo adaptador.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/inklink/object-storage.json"]
    ports:
      - "127.0.0.1:5188:8333"
    volumes:
      - object-storage-data:/data
      - ../../artifacts/local/object-storage.json:/etc/inklink/object-storage.json:ro
      - ./scripts/configure-object-storage.sh:/opt/inklink/configure-object-storage.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  scheduling-data:
  finance-data:
  identity-data:
  catalog-data:
  engagements-data:
  messaging-data:
  broker-data:
  bff-data:
  keycloak-data:
  object-storage-data:
