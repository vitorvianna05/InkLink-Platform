name: Website
on:
  push:
    paths:
      - src/frontends/web/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - src/frontends/web/**
      - .github/workflows/web.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: src/frontends/web
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontends/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks (360/768/1280 px, keyboard)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-results
          path: |
            src/frontends/web/test-results/
            src/frontends/web/playwright-report/
          if-no-files-found: ignore
